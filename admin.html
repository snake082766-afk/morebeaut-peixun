<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2C1E08">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="成長陪跑管理">
<title>經銷商成長陪跑｜管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root{--bg:#F7F2E9;--card:#FFFDF8;--line:#E8DCC4;--soft:#F1E6CC;--ink:#2C1E08;--muted:#6B5B45;--gold:#8B6914;--gold2:#C9A961;--red:#8A3A22;--redbg:#F6DED5;--blue:#2F5D8A;--bluebg:#E3EAF2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif;-webkit-text-size-adjust:100%;font-size:15px}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#FFFDF8;padding:12px 16px 0}
.top .row1{display:flex;align-items:center;gap:10px;max-width:960px;margin:0 auto}
.top b{color:var(--gold2);letter-spacing:1px;font-size:15px}
.top .meta{color:var(--line);font-size:12px;flex:1;text-align:right}
.tabs{display:flex;gap:4px;max-width:960px;margin:10px auto 0}
.tab{flex:1;min-height:44px;border:none;background:transparent;color:var(--line);font:inherit;font-size:15px;border-bottom:3px solid transparent;cursor:pointer}
.tab.on{color:#FFFDF8;border-bottom-color:var(--gold2);font-weight:700}
.tab .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--gold2);color:var(--ink);font-size:12px;font-weight:700;margin-left:4px}
main{max-width:960px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:14px}
h1{font-family:'Noto Serif TC',serif;font-size:22px;margin:0;line-height:1.4}
h2{font-size:16px;margin:0 0 10px}
.muted{color:var(--muted)}.small{font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;color:var(--ink);text-align:left;cursor:pointer;width:100%}.tile.on{border:2px solid var(--ink)}.tile .go{font-size:11px;color:var(--muted)}
.sec{margin:14px 2px 6px;font-weight:700;scroll-margin-top:110px}.sec small{font-weight:500;color:var(--muted);margin-left:6px}
.tile .l{font-size:12px;color:var(--muted)}.tile .v{font-size:24px;font-weight:700;margin-top:2px}.tile .v span{font-size:13px;color:var(--muted);font-weight:500}
.alert{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;color:var(--ink);cursor:pointer}
.alert.on{border:2px solid var(--ink)}
.alert i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px}
.alert b{display:block;font-size:14px}.alert small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#FFFDF8}
.person{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;color:var(--ink);cursor:pointer}
.person .main{flex:1;min-width:0}
.person .nm{font-weight:700;font-size:16px}
.person .sub{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.5}
.badge{flex:none;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.b-up{background:var(--soft);color:#6B4F0A}.b-fix{background:var(--redbg);color:var(--red)}.b-wait{background:var(--bluebg);color:var(--blue)}.b-ok{background:#EFEAE0;color:#4A3D2A}
.it{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--soft)}.it:last-child{border-bottom:none}
.mk{width:22px;flex:none;color:var(--gold);font-weight:700}
.bar{height:8px;border-radius:999px;background:var(--soft);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.tag{display:inline-block;font-size:12px;background:var(--soft);border-radius:999px;padding:4px 10px;margin:4px 6px 0 0}
.tag.dark{background:var(--ink);color:#FFFDF8}
.quote{background:var(--bg);border-radius:10px;padding:10px 12px;line-height:1.7;margin-top:6px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;border:none;background:none;font:inherit;color:var(--muted);cursor:pointer;padding:0}
.btn{min-height:48px;border-radius:12px;border:none;background:var(--gold);color:#FFFDF8;font:inherit;font-weight:700;font-size:15px;cursor:pointer;width:100%}
.btn2{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;width:100%}
button:disabled{opacity:.5}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
input[type=text],textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
textarea{min-height:72px;resize:vertical;line-height:1.6}
.datebox{display:block;width:100%;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#fff}
.datebox input{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;min-height:46px;border:none;margin:0;padding:10px 12px;font:inherit;font-size:15px;background:transparent;color:var(--ink);text-align:left}
.datebox input::-webkit-date-and-time-value{text-align:left}
.qi{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;color:var(--ink);cursor:pointer}
.qi .ty{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--soft);color:#6B4F0A}
.qi .ty.fail{background:var(--redbg);color:var(--red)}
.imgs{display:flex;gap:8px;overflow-x:auto}.imgs img{height:260px;border-radius:10px;border:1px solid var(--line)}
.act{padding:10px 0;border-bottom:1px solid var(--soft)}.act:last-child{border-bottom:none}
.act .h{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.lv{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lv button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:13px;color:var(--ink)}
.lv button.on{background:var(--ink);border-color:var(--ink);color:#FFFDF8}
.lv button.warn{border-color:var(--red);color:var(--red)}
.warnbox{background:var(--redbg);color:var(--red);border-radius:12px;padding:10px 12px;line-height:1.6}
pre{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:14px;line-height:1.75;margin:0}
.empty{padding:28px 0;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#FFFDF8;padding:12px 18px;border-radius:12px;font-size:14px;max-width:90vw;z-index:9}
@media (min-width:760px){.two{display:grid;grid-template-columns:3fr 2fr;gap:14px;align-items:start}.two>div{display:flex;flex-direction:column;gap:14px}}
</style>
</head>
<body>
<div class="top">
  <div class="row1"><b>經銷商成長陪跑｜管理</b><span class="meta" id="meta"></span></div>
  <nav class="tabs" aria-label="分頁">
    <button type="button" class="tab on" data-tab="dash">總覽</button>
    <button type="button" class="tab" data-tab="queue">待核准<span class="n" id="qn" hidden></span></button>
    <button type="button" class="tab" data-tab="meet">研討會</button>
    <button type="button" class="tab" data-tab="summary">週報</button>
  </nav>
</div>
<main id="app" aria-live="polite"><div class="empty">讀取中…</div></main>

<script>
/* 與經銷商網頁相同的 Apps Script 網址 */
var API = 'https://script.google.com/macros/s/AKfycbxzJQgf9zouBQEHfme6B__etQj1A1lRJQ9LggZnMWy_6TIMqCfGrrqbgh8JSsYkgSgp/exec';

var KEY = new URLSearchParams(location.search).get('k') || '';
try { if (KEY) localStorage.setItem('peixun_admin', KEY); else KEY = localStorage.getItem('peixun_admin') || ''; } catch (e) {}
var tab = 'dash', D = null, filter = 'todo', alertKey = '', tileKey = '', cur = null;
var TILES = { d: ['已初次盤點', '已填', '還沒填', null], a: ['已派任務', '已派', '還沒派', null], r: ['本週已回報', '已回報', '還沒回報', 'due'], v: ['證據已核對', '已核對', '待核對', 'r'], i: ['有進步', '有進步', '還沒有新進步', 'c'] };

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(m) { var t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600); }
function show(h) { $('app').innerHTML = h; window.scrollTo(0, 0); }
function loading(m) { show('<div class="empty">' + esc(m || '讀取中…') + '</div>'); }
function err(e) { show('<div class="card"><b>讀不到資料</b><p class="muted">' + esc((e && e.message) || e) + '</p></div>'); }

function get(fn, extra) {
  var q = API + '?admin=' + encodeURIComponent(KEY) + '&fn=' + fn + (extra || '');
  return fetch(q).then(function (r) { return r.json(); }).then(function (r) { if (!r.ok) throw new Error(r.error); return r.data; });
}
function post(body) {
  body.admin = KEY;
  return fetch(API, { method: 'POST', body: JSON.stringify(body) }).then(function (r) { return r.json(); }).then(function (r) { if (!r.ok) throw new Error(r.error); return r; });
}

document.querySelectorAll('.tab').forEach(function (b) {
  b.onclick = function () { tab = b.getAttribute('data-tab'); document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('on', x === b); }); route(); };
});
function route() { if (tab === 'dash') loadDash(); else if (tab === 'queue') loadQueue(); else if (tab === 'meet') loadMeets(); else loadSummary(); }
function setQ(n) { var el = $('qn'); el.hidden = !n; el.textContent = n || ''; }

/* ---------- 總覽 ---------- */
var BADGE = { '進步': 'b-up', '要加強': 'b-fix', '待補證據': 'b-wait', '待確認方向': 'b-wait', '待補充': 'b-wait', '照進度': 'b-ok', '暫緩': 'b-ok' };
function loadDash() {
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem('peixun_admin_dash') || 'null'); } catch (e) {}
  if (!D && cached) D = cached;
  if (D) { setQ(D.queue); $('meta').textContent = '更新中…'; renderDash(); } else loading();
  get('dash').then(function (d) {
    D = d; setQ(d.queue); $('meta').textContent = '第 ' + d.round + ' 輪 · ' + d.stamp;
    try { localStorage.setItem('peixun_admin_dash', JSON.stringify(d)); } catch (e) {}
    if (tab === 'dash' && !document.getElementById('back')) renderDash();
  }).catch(function (e) { if (D) { $('meta').textContent = '連線不順，顯示上次內容'; } else err(e); });
}
function renderDash() {
  var c = D.c, ok = D.rows.length - c.todo;
  var h = '<div><h1>本週要協助 ' + c.todo + ' 位，' + ok + ' 位照進度走</h1><div class="small muted" style="margin-top:4px">另有待核准 ' + c.qWait + ' 筆、等待產生草稿 ' + c.qQueued + ' 筆' + (c.qQueued && !D.autoOn ? '（自動草稿未啟用）' : '') + '；只計已核對的紀錄' + (D.out && D.out.length ? '<br>不參與 ' + D.out.length + ' 位（不列入統計）：' + esc(D.out.map(function (o) { return o.name; }).join('、')) : '') + '</div></div>';
  h += '<div class="tiles">' + tile('d', c.diagnosed, c.members) + tile('a', c.assigned, c.members) + tile('r', c.reported, c.dueNow) + tile('v', c.verified, c.reported) + tile('i', c.improved, c.compared) + '</div>';
  h += alertBtn('miss', '連續 2 項任務未完成', c.miss2, '先問卡點，把任務縮成一個動作', 'var(--red)');
  h += alertBtn('pending', '證據待補超過 1 週', c.pendingP, '提醒補截圖，未補前不打勾', 'var(--blue)');
  h += alertBtn('hint', '同一動作 2 次仍需提示', c.hint2, '看一次真實案例，示範後重做', 'var(--gold)');
  if (c.waiting) h += alertBtn('wait', '等經銷商補件', c.waiting, '他還沒補交或補充；按進去可複製提醒', 'var(--blue)');
  if (c.meetCount) h += alertBtn('meet', '研討會有缺席', c.meetMiss || 0, '確認原因；依規則需要時回報執行長', 'var(--muted)');
  var fs = [['todo', '需要我處理'], ['all', '全部'], ['董事', '董事'], ['35位', '35位']];
  if (D.rows.some(function (r) { return r.track === '擴大梯次'; })) fs.push(['擴大梯次', '擴大梯次']);
  ['TOP', 'THE ONE', 'PRINCESSES', 'RICH'].forEach(function (t) { if (D.rows.some(function (r) { return r.team === t; })) fs.push(['team:' + t, t]); });
  h += '<div class="chips" role="group" aria-label="篩選">' + fs.map(function (f) { return '<button type="button" class="chip' + (filter === f[0] && !alertKey ? ' on' : '') + '" data-f="' + f[0] + '">' + f[1] + ' ' + D.rows.filter(function (r) { return match(r, f[0]); }).length + '</button>'; }).join('') + '</div>';
  var rows = D.rows.filter(function (r) {
    if (alertKey === 'miss') return r.miss >= 2 && !r.paused;
    if (alertKey === 'pending') return r.pending > 0 && !r.paused;
    if (alertKey === 'hint') return r.hintTwice > 0 && !r.paused;
    if (alertKey === 'meet') return r.meetMiss > 0 && !r.paused;
    if (alertKey === 'wait') return r.wait && !r.paused;
    return match(r, filter);
  });
  var T = tileKey && TILES[tileKey];
  if (T && D.rows[0] && !D.rows[0].f) { T = null; tileKey = ''; }
  if (alertKey === 'wait' && rows.length) { WAITMSG = rows.map(function (r) { return remindText(r.name, r.wait.what === '盤點補充' ? '方向' : '回報'); }); COPYNO = rows.map(function (r) { return r.name; }).join('、'); h += '<button type="button" class="btn2" id="copyNo">複製這 ' + rows.length + ' 位的名字</button>'; }
  if (T) {
    var teamK = filter.indexOf('team:') === 0 ? filter : '';
    var base = D.rows.filter(function (r) { return (!T[3] || r.f[T[3]]) && (!teamK || match(r, teamK)); });
    var yes = base.filter(function (r) { return r.f[tileKey]; }), no = base.filter(function (r) { return !r.f[tileKey]; });
    h += '<div class="sec">' + (teamK ? esc(teamK.slice(5)) + '｜' : '') + T[2] + ' ' + no.length + ' 位<small>點同一格可收起</small></div>';
    if (no.length) { COPYNO = no.map(function (r) { return r.name; }).join('、'); h += '<button type="button" class="btn2" id="copyNo">複製這 ' + no.length + ' 位的名字</button>'; }
    h += no.length ? no.map(personBtn).join('') : '<div class="card empty">沒有</div>';
    h += '<div class="sec">' + T[1] + ' ' + yes.length + ' 位</div>';
    h += yes.length ? yes.map(personBtn).join('') : '<div class="card empty">還沒有</div>';
    rows = [];
  }
  else if (!D.rows.length) h += '<div class="card empty">名單還是空的</div>';
  else if (!rows.length) h += '<div class="card empty">這個篩選沒有人</div>';
  rows.forEach(function (r) { h += personBtn(r); });
  show(h);
  bindDash();
}
function personBtn(r) {
    return '<button type="button" class="person" data-id="' + esc(r.id) + '"><span class="main"><span class="nm">' + esc(r.name) + '</span> <span class="small muted">' + esc(r.track) + '</span>' +
      '<span class="sub" style="display:block">' + esc(r.typeText || '尚未確認方向') + '</span>' +
      '<span class="sub" style="display:block">' + (r.week ? '第 ' + r.week + ' 週 · ' : '') + esc(r.thisRep) + (r.miss ? ' · 連續未完成 ' + r.miss : '') + '</span>' +
      '<span class="sub" style="display:block">' + esc(r.latest) + (r.newOnes ? ' · 新進步 ' + r.newOnes : '') + '</span>' +
      (r.result ? '<span class="sub" style="display:block">' + esc(r.result) + '</span>' : '') +
      (r.wait ? '<span class="sub" style="display:block;color:var(--blue)">等他' + esc(r.wait.what) + ' · 已 ' + r.wait.days + ' 天</span>' : '') +
      (r.next && r.next !== '—' ? '<span class="sub" style="display:block;color:var(--gold)">→ ' + esc(r.next) + '</span>' : '') +
      '</span><span class="badge ' + (BADGE[r.verdict] || 'b-ok') + '">' + esc(r.verdict) + '</span></button>';
}
var COPYNO = '', WAITMSG = [];
function shortName(n) { n = String(n || ''); return n.length === 3 ? n.slice(1) : n; }
function remindText(name, type) {
  var nm = shortName(name);
  return type === '方向'
    ? nm + '你好！我看完你的盤點，有一個想多了解的小地方，問題放在你的專屬連結最上面，打開就會看到 😊 一兩句話回答就好，你上次填的內容都還在。補完我就幫你安排任務！'
    : nm + '你好！我看過你這週的回報了，有給你一點建議，打開你的專屬連結就會看到 😊 做完再補交給我就好～';
}
function bindDash() {
  if ($('copyNo')) $('copyNo').onclick = function () { copyText(COPYNO, this); };
  document.querySelectorAll('[data-t]').forEach(function (b) { b.onclick = function () { var k = b.getAttribute('data-t'); tileKey = tileKey === k ? '' : k; alertKey = ''; renderDash(); var sec = document.querySelector('.sec'); if (tileKey && sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); }; });
  document.querySelectorAll('[data-f]').forEach(function (b) { b.onclick = function () { filter = b.getAttribute('data-f'); alertKey = ''; if (filter.indexOf('team:') !== 0 && filter !== 'all') tileKey = ''; renderDash(); }; });
  document.querySelectorAll('[data-a]').forEach(function (b) { b.onclick = function () { var k = b.getAttribute('data-a'); alertKey = alertKey === k ? '' : k; tileKey = ''; renderDash(); }; });
  document.querySelectorAll('.person').forEach(function (b) { b.onclick = function () { loadPerson(b.getAttribute('data-id')); }; });
}
function tile(k, n, d) { return '<button type="button" class="tile' + (tileKey === k ? ' on' : '') + '" data-t="' + k + '" aria-pressed="' + (tileKey === k) + '"><div class="l">' + TILES[k][0] + '</div><div class="v">' + n + '<span> / ' + d + '</span></div><div class="go">' + (tileKey === k ? '收起 ▴' : '看名單 ▾') + '</div></button>'; }
function alertBtn(k, t, n, s, color) { return '<button type="button" class="alert' + (alertKey === k ? ' on' : '') + '" data-a="' + k + '"><i style="background:' + color + '"></i><span><b>' + t + ' · ' + n + ' 位</b><small>' + s + '</small></span></button>'; }
function match(r, k) { return k === 'all' ? true : k.indexOf('team:') === 0 ? r.team === k.slice(5) : k === 'todo' ? ['要加強', '待補證據', '待確認方向', '待補充'].indexOf(r.verdict) >= 0 : r.track === k; }

/* ---------- 個人頁 ---------- */
var MARK = { can: '✓', hint: '◐', practice: '○', wait: '┄' }, STXT = { can: '獨立', hint: '提示後', practice: '練習中', wait: '待觀察' };
function loadPerson(id) { loading(); get('person', '&id=' + encodeURIComponent(id)).then(renderPerson).catch(err); }
function renderPerson(p) {
  var h = '<button type="button" class="back" id="back">← 回到總覽</button>';
  h += '<div><div class="small muted">' + esc([p.track, p.level, p.status].filter(String).join(' · ')) + ' · ' + esc(p.id) + '</div><h1>' + esc(p.name) + '</h1><div>' +
    (p.typeText ? '<span class="tag dark">' + esc(p.typeText) + '</span>' : '<span class="tag">尚未確認方向</span>') + p.comps.map(function (c) { return '<span class="tag">' + esc(c.code + ' ' + c.name) + '</span>'; }).join('') + '</div></div>';
  if (p.intro) h += '<div class="card"><h2>心蘋看到的你（他看得到）</h2><div style="line-height:1.8;white-space:pre-wrap">' + esc(p.intro) + '</div></div>';

  return { actions: it.acts.map(function (a, i) { return { code: a.code, level: a.level, evidence: $('ev' + i).value }; }),
    increments: (it.incs || []).map(function (x, i) { return { label: x.label, add: Number($('inc' + i).value) || 0 }; }),
    good: $('good').value, next: $('next').value, memo: $('memo').value };
}
function approve() {
  var e = collect();
  if (cur.type === '回報' && e.actions.some(function (a) { return a.level === '無法判斷'; })) { toast('還有動作是「無法判斷」，請先選定'); return; }
  var b = $('approve'); b.disabled = true; b.textContent = '寫入中…';
  post({ fn: 'approve', id: cur.id, edit: e }).then(function () { toast('已核准'); dropQ(cur.id); loadQueue(); }).catch(function (x) { toast(x.message); b.disabled = false; b.textContent = '再試一次'; });
}
function reject() {
  var why = $('why').value.trim(); if (!why) { toast('請寫退回原因，經銷商會看到'); return; }
  var b = $('reject'), label = b.textContent; b.disabled = true; b.textContent = '送出中…';
  post({ fn: 'reject', id: cur.id, reason: why }).then(function () {
    dropQ(cur.id);
    var t = remindText(cur.member.name, cur.type);
    show(backQ() + '<div class="card"><h2>' + (cur.type === '方向' ? '已請他補充' : '已退回補件') + '</h2><p class="muted" style="margin:0 0 10px">系統不會通知他。請複製下面這段，到官方 LINE 傳給' + esc(cur.member.name) + '：</p><div class="quote">' + esc(t) + '</div><div style="margin-top:12px"><button type="button" class="btn" id="copyRemind">複製提醒訊息</button></div></div>');
    $('copyRemind').onclick = function () { copyText(t, this); };
    $('backq').onclick = loadQueue;
  }).catch(function (x) { toast(x.message); b.disabled = false; b.textContent = label; });
}

/* ---------- 週報 ---------- */
function loadSummary() { loading(); get('summary').then(renderSummary).catch(err); }
function copyText(t, btn) {
  var label = btn.textContent;
  var done = function () { btn.textContent = '已複製'; setTimeout(function () { btn.textContent = label; }, 2000); };
  function fallback() { var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('請長按文字手動複製'); } a.remove(); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fallback); else fallback();
}
function renderSummary(s) {
  var h = '<div><h1>本週報告摘要</h1><div class="small muted" style="margin-top:4px">複製後貼到公司的週報；數字以現在的資料計算</div></div>';
  if (s.gaps) h += '<div class="card"><h2>這週共同卡點（研討會選題參考）</h2><pre>' + esc(s.gaps.text) + '</pre></div>';
  h += '<button type="button" class="btn" id="copy">複製摘要</button>';
  h += '<div class="card"><pre id="sum">' + esc(s.text) + '</pre></div>';
  if (s.teams && s.teams.length) {
    h += '<div><h1 style="font-size:19px">給團隊長的進度</h1><div class="small muted" style="margin-top:4px">只有完成狀況，不含任何回報內容；複製後傳給各團隊長</div></div>';
    s.teams.forEach(function (t, i) { h += '<div class="card"><pre>' + esc(t.text) + '</pre><div style="margin-top:10px"><button type="button" class="btn2" data-team="' + i + '">複製 ' + esc(t.team) + '</button></div></div>'; });
  } else h += '<div class="card muted">名單填上「團隊」後，這裡會出現給各團隊長的進度。</div>';
  show(h);
  $('copy').onclick = function () { copyText(s.text, this); };
  document.querySelectorAll('[data-team]').forEach(function (b) { b.onclick = function () { copyText(s.teams[+b.getAttribute('data-team')].text, b); }; });
}

/* ---------- 研討會 ---------- */
var MEET = null;
function loadMeets() { loading(); get('meets').then(renderMeets).catch(err); }
function renderMeets(r) {
  var today = new Date(), iso = today.getFullYear() + '-' + ('0' + (today.getMonth() + 1)).slice(-2) + '-' + ('0' + today.getDate()).slice(-2);
  var h = '<div><h1>研討會出席</h1><div class="small muted" style="margin-top:4px">會前建立：寫好重點、這週行動和簽到關鍵字。會後大家用簽到關鍵字自己簽到，不用點名</div></div>';
  h += '<div class="card"><h2>新增一場</h2><label for="mname" style="margin-top:0">名稱</label><input type="text" id="mname" placeholder="例如：第 1 週線上研討會"><label for="mdate">日期</label><div class="datebox"><input type="date" id="mdate" value="' + iso + '"></div>' +
    '<label for="mpoints">這場重點（經銷商會看到，缺席的人也能補看）</label><textarea id="mpoints" placeholder="例如：客人說「考慮一下」時，先問一句「你最在意的是哪一點？」"></textarea>' +
    '<label for="maction">這週行動（會後要大家做的一件事）</label><input type="text" id="maction" placeholder="例如：找 1 位說過考慮的客人，用今天的問法再聊一次">' +
    '<label for="mcode">簽到關鍵字（會議最後說出來）</label><input type="text" id="mcode" placeholder="例如：需求">' +
    '<div class="small muted" style="margin-top:6px">經銷商在研討會當天，用自己的連結輸入簽到關鍵字＋寫一句心得，就會自動記為出席。不填就改用手動點名。</div>' +
    '<div style="margin-top:12px"><button type="button" class="btn" id="mnew">建立這場研討會</button></div></div>';
  if (!r.items.length) h += '<div class="card empty">還沒有研討會紀錄</div>';
  r.items.forEach(function (m) { h += '<button type="button" class="qi" data-m="' + esc(m.id) + '"><span class="ty">' + esc(m.date) + '</span><span style="flex:1"><b>' + esc(m.name) + '</b><span class="small muted" style="display:block">出席 ' + m.present + ' / ' + m.total + '</span></span><span class="muted">›</span></button>'; });
  show(h);
  $('mnew').onclick = function () {
    var name = $('mname').value.trim(); if (!name) { toast('請填研討會名稱'); return; }
    var b = this; b.disabled = true; b.textContent = '建立中…';
    post({ fn: 'meetNew', date: $('mdate').value, name: name, points: $('mpoints').value, action: $('maction').value, code: $('mcode').value }).then(function (x) { toast('已建立'); openMeet(x.data.id); }).catch(function (e) { toast(e.message); b.disabled = false; b.textContent = '建立這場研討會'; });
  };
  document.querySelectorAll('[data-m]').forEach(function (b) { b.onclick = function () { openMeet(b.getAttribute('data-m')); }; });
}
function openMeet(id) { loading(); get('meet', '&id=' + encodeURIComponent(id)).then(function (m) { MEET = m; renderMeet(); }).catch(err); }
function renderMeet() {
  var m = MEET, n = m.people.filter(function (p) { return p.present; }).length;
  var h = '<button type="button" class="back" id="mback">← 研討會列表</button><div><h1>' + esc(m.name) + '</h1><div class="small muted">' + esc(m.date) + ' · 有簽到關鍵字的話大家會自己簽到；要補登，點名字切換後按儲存</div></div>';
  var selfN = m.people.filter(function (p) { return p.present && p.self; }).length;
  h += '<div class="tiles"><div class="tile" style="cursor:default"><div class="l">出席</div><div class="v">' + n + '<span> / ' + m.people.length + '</span></div><div class="go">自己簽到 ' + selfN + ' 位</div></div></div>';
  h += '<details class="card"' + (m.points || m.action || m.code ? '' : ' open') + '><summary style="font-weight:700;cursor:pointer;min-height:32px">重點、這週行動與簽到關鍵字</summary>' +
    '<label for="ep">這場重點</label><textarea id="ep">' + esc(m.points) + '</textarea><label for="ea">這週行動</label><input type="text" id="ea" value="' + esc(m.action) + '"><label for="ec">簽到關鍵字</label><input type="text" id="ec" value="' + esc(m.code) + '">' +
    '<div style="margin-top:10px"><button type="button" class="btn2" id="esave">儲存這三項</button></div></details>';
  var notes = m.people.filter(function (p) { return p.present && p.note; });
  if (notes.length) h += '<div class="card"><h2>大家帶走的一件事（' + notes.length + '）</h2>' + notes.map(function (p) { return '<div class="it" style="display:block"><b>' + esc(p.name) + '</b><div class="small" style="line-height:1.6;margin-top:2px">' + esc(p.note) + '</div></div>'; }).join('') + '</div>';
  var teams = []; m.people.forEach(function (p) { var t = p.team || '未分團隊'; if (teams.indexOf(t) < 0) teams.push(t); });
  teams.forEach(function (t) {
    var ps = m.people.filter(function (p) { return (p.team || '未分團隊') === t; });
    h += '<div class="sec">' + esc(t) + '<small>' + ps.filter(function (p) { return p.present; }).length + ' / ' + ps.length + '</small></div><div class="lv" style="margin-top:0">';
    ps.forEach(function (p) { var i = m.people.indexOf(p); h += '<button type="button" data-p="' + i + '" class="' + (p.present ? 'on' : '') + '" aria-pressed="' + p.present + '" style="min-height:44px">' + (p.present ? '✓ ' : '') + esc(p.name) + '</button>'; });
    h += '</div>';
  });
  h += '<div style="position:sticky;bottom:12px;margin-top:8px"><button type="button" class="btn" id="msave">儲存點名（出席 ' + n + ' 位）</button></div>';
  var y = window.scrollY; show(h); window.scrollTo(0, y);
  $('mback').onclick = loadMeets;
  $('esave').onclick = function () {
    var b = this; MEET.points = $('ep').value; MEET.action = $('ea').value; MEET.code = $('ec').value; b.disabled = true; b.textContent = '儲存中…';
    post({ fn: 'meetEdit', id: m.id, points: MEET.points, action: MEET.action, code: MEET.code }).then(function () { toast('已儲存'); b.disabled = false; b.textContent = '儲存這三項'; }).catch(function (e) { toast(e.message); b.disabled = false; b.textContent = '再試一次'; });
  };
  document.querySelectorAll('[data-p]').forEach(function (b) { b.onclick = function () { var p = MEET.people[+b.getAttribute('data-p')]; p.present = !p.present; renderMeet(); }; });
  $('msave').onclick = function () {
    var b = this; b.disabled = true; b.textContent = '儲存中…';
    post({ fn: 'meetSave', id: m.id, present: m.people.filter(function (p) { return p.present; }).map(function (p) { return p.id; }) })
      .then(function () { toast('已儲存點名'); loadMeets(); }).catch(function (e) { toast(e.message); b.disabled = false; b.textContent = '再試一次'; });
  };
}

if (!KEY) show('<div class="card"><b>需要管理連結</b><p class="muted">請到試算表選單「經銷商成長陪跑 → 手機管理頁連結」取得你的專屬網址。</p></div>');
else route();
</script>
</body>
</html>
